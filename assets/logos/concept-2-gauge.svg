<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141E"/>
      <stop offset="100%" stop-color="#07070B"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997514"/>
    </linearGradient>
    <linearGradient id="redGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5268"/>
      <stop offset="100%" stop-color="#D6001C"/>
    </linearGradient>
    <filter id="gaugeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad2)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#goldGrad2)" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Outer Gauge Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#222230" stroke-width="16"/>
  
  <!-- Active Tachometer Arch (0 to Redline) -->
  <path d="M128.7 383.3 A 180 180 0 1 1 383.3 383.3" 
        fill="none" stroke="url(#goldGrad2)" stroke-width="14" stroke-linecap="round" stroke-dasharray="640 400"/>
  
  <!-- Redline Zone Arch -->
  <path d="M345 130 A 180 180 0 0 1 383.3 383.3" 
        fill="none" stroke="url(#redGrad2)" stroke-width="18" stroke-linecap="round" filter="url(#gaugeGlow)"/>

  <!-- Aperture Iris Blades (Inside Gauge) -->
  <g opacity="0.35" stroke="url(#goldGrad2)" stroke-width="2" fill="none">
    <path d="M256 120 L330 190 L290 270 Z"/>
    <path d="M380 210 L350 300 L260 300 Z"/>
    <path d="M340 340 L250 350 L210 270 Z"/>
    <path d="M210 360 L140 300 L180 220 Z"/>
    <path d="M130 250 L170 170 L260 180 Z"/>
    <path d="M200 130 L280 130 L310 210 Z"/>
  </g>

  <!-- Dial Tick Marks -->
  <g stroke="url(#goldGrad2)" stroke-width="4" stroke-linecap="round">
    <line x1="256" y1="88" x2="256" y2="108"/>
    <line x1="375" y1="137" x2="361" y2="151"/>
    <line x1="424" y1="256" x2="404" y2="256" stroke="#FF5268" stroke-width="5"/>
    <line x1="375" y1="375" x2="361" y2="361" stroke="#FF5268" stroke-width="5"/>
    <line x1="137" y1="137" x2="151" y2="151"/>
    <line x1="88" y1="256" x2="108" y2="256"/>
    <line x1="137" y1="375" x2="151" y2="361"/>
  </g>

  <!-- Speedometer Needle Pointing to Apex Peak -->
  <g filter="url(#gaugeGlow)">
    <polygon points="256,238 262,256 370,140 256,242" fill="url(#redGrad2)"/>
    <polygon points="256,242 262,256 370,140" fill="#FFA3AF"/>
  </g>

  <!-- Center Hub Spinner Cap -->
  <circle cx="256" cy="256" r="44" fill="#0C0C12" stroke="url(#goldGrad2)" stroke-width="6"/>
  <circle cx="256" cy="256" r="22" fill="url(#goldGrad2)"/>
  <circle cx="256" cy="256" r="8" fill="#FFFFFF"/>

  <!-- Digital Readout Style: RPM / 4K -->
  <text x="256" y="340" font-family="'Orbitron', 'Inter', monospace" font-size="24" font-weight="900" letter-spacing="4" fill="url(#goldGrad2)" text-anchor="middle">APEX</text>
  <text x="256" y="365" font-family="'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="6" fill="#FF5268" text-anchor="middle">4K CINEMA</text>
</svg>